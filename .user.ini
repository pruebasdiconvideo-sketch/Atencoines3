; .user.ini - Configuración PHP a nivel de aplicación (IIS FastCGI respeta este archivo)
;
; Objetivo: permitir subir documentos pesados al sistema (hasta 200 MB) y
; optimizar el rendimiento para 5000 usuarios concurrentes.
; El límite efectivo en IIS se controla en web.config > requestLimits.maxAllowedContentLength (200 MB).
;
; Estos valores deben ser ligeramente SUPERIORES a maxAllowedContentLength
; para que PHP no rechace el archivo antes que IIS lo haga.

; Tamaño máximo de un archivo subido
upload_max_filesize = 200M

; Tamaño máximo del cuerpo POST completo (debe ser >= upload_max_filesize)
post_max_size = 210M

; Tiempo máximo de ejecución de un script PHP (segundos).
; Subir 200 MB por una conexión lenta puede tomar tiempo.
max_execution_time = 300

; Tiempo máximo de entrada del script (lectura de POST).
max_input_time = 300

; Memoria por script (subida de archivos grandes necesita RAM).
memory_limit = 512M

; Sesión: caducidad en segundos (24h para no interrumpir jornada laboral).
session.gc_maxlifetime = 86400

; =====================================================================
; COMPRESIÓN GZIP — activada al INICIO de cada request PHP (no en runtime).
; Esto es compatible con IIS FastCGI y comprime todas las respuestas JSON
; reduciendo ~80% el tamaño transmitido (clave para 5000 usuarios).
; Importante: debe estar en .user.ini (NO en ini_set dentro del código)
; porque PHP lo carga ANTES de empezar a generar output.
; =====================================================================
zlib.output_compression = On
zlib.output_compression_level = 5

; Output buffering ON: evita "headers already sent" y mejora rendimiento
output_buffering = 4096

; OPcache (clave para 5000 usuarios concurrentes — reduce compilación PHP).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 60
opcache.validate_timestamps = 1
